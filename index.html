    <script>

        const DEFAULT_POSTS = [

                content: 'Wann hast du das letzte Mal deinen Kleiderschrank oder deinen Desktop aufgeräumt? Minimalismus bedeutet nicht, in einer leeren weißen Wohnung zu leben, sondern Platz für das Wesentliche zu schaffen.',

                video: '',

                status: 'published',

            },
            {

                title: 'Der ultimative Notfall-Guide für verregnete Sonntage',
                category: 'Just-In-Case',
                content: 'Es regnet, du hast alles aufgeräumt, Netflix durchgespielt und weißt nicht wohin mit deiner Energie? Hier ist dein Rettungsschirm: Kreative DIY-Ideen, Journaling-Prompts und Playlist-Empfehlungen.',
                image: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=800&q=80',

                author: 'Admin',

                status: 'draft',
                likes: 0,
                likedBy: []
            }
        ];

        const DEFAULT_COMMENTS = {
            'post-1': [
                { id: 'c1', author: 'Sarah', text: 'Der Tipp mit dem Smartphone am Morgen hat mein Leben verändert!', date: '2026-06-02' }
            ],
            'post-2': [
                { id: 'c2', author: 'Julian', text: 'Gestern nachgekocht,absolute Empfehlung! 10/10.', date: '2026-06-03' }
            ]
        };

        let appState = {
            currentUser: JSON.parse(localStorage.getItem('mijokama_user')) || null, // { username, role: 'admin'|'user' }
            posts: JSON.parse(localStorage.getItem('mijokama_posts')) || DEFAULT_POSTS,
            comments: JSON.parse(localStorage.getItem('mijokama_comments')) || DEFAULT_COMMENTS,
            guestSubmissions: JSON.parse(localStorage.getItem('mijokama_submissions')) || [],
            messages: JSON.parse(localStorage.getItem('mijokama_messages')) || [],
            aboutText: localStorage.getItem('mijokama_about') || DEFAULT_ABOUT_TEXT
        };

        function saveState() {
            localStorage.setItem('mijokama_user', JSON.stringify(appState.currentUser));
            localStorage.setItem('mijokama_posts', JSON.stringify(appState.posts));
            localStorage.setItem('mijokama_comments', JSON.stringify(appState.comments));
            localStorage.setItem('mijokama_submissions', JSON.stringify(appState.guestSubmissions));
            localStorage.setItem('mijokama_messages', JSON.stringify(appState.messages));
            localStorage.setItem('mijokama_about', appState.aboutText);
        }

        // --- Router System ---
        const router = {
            currentPage: 'home',
            currentParam: 'all',
            currentPostId: null,
            navigate: function(page, param = null, postId = null) {
                this.currentPage = page;
                this.currentParam = param;
                this.currentPostId = postId;
                window.scrollTo({ top: 0, behavior: 'smooth' });
                renderApp();
            }
        };

        // --- Notification Toast System ---
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-slate-900 text-white' : 'bg-red-600 text-white';
            toast.className = `${bgClass} px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center space-x-3 transform translate-y-4 opacity-0 transition-all duration-300 pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-pink-400' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // --- Render Main Application UI ---
        function renderApp() {
            renderAuthNavbar();
            const container = document.getElementById('app-content');
            
            switch(router.currentPage) {
                case 'home':
                    container.innerHTML = renderHomePage();
                    break;
                case 'blog':
                    container.innerHTML = renderBlogPage(router.currentParam);
                    break;
                case 'post-detail':
                    container.innerHTML = renderPostDetailPage(router.currentPostId);
                    break;
                case 'about':
                    container.innerHTML = renderAboutPage();
                    break;
                case 'contact':
                    container.innerHTML = renderContactPage();
                    break;
                case 'admin':
                    if (!appState.currentUser || appState.currentUser.role !== 'admin') {
                        router.navigate('home');
                        showToast('Zugriff verwehrt. Nur für Administratoren.', 'error');
                        return;
                    }
                    container.innerHTML = renderAdminDashboard();
                    break;
                default:
                    container.innerHTML = renderHomePage();
            }
        }

        // --- Navigation Auth UI Updates ---
        function renderAuthNavbar() {
            const container = document.getElementById('auth-status-container');
            const mobileContainer = document.getElementById('mobile-auth-container');
            
            if (appState.currentUser) {
                const isAdmin = appState.currentUser.role === 'admin';
                const badge = isAdmin ? '<span class="bg-pink-100 text-pink-600 px-2.5 py-0.5 rounded-full text-xs font-bold">Admin</span>' : '<span class="bg-slate-100 text-slate-600 px-2.5 py-0.5 rounded-full text-xs font-semibold">User</span>';
                
                let adminBtn = isAdmin ? `<button onclick="router.navigate('admin')" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-md shadow-pink-500/20 transition flex items-center gap-1.5"><i class="fa-solid fa-gauge"></i> Dashboard</button>` : '';
                
                container.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <div class="text-right">
                            <p class="text-xs font-bold text-slate-700">${appState.currentUser.username}</p>
                            ${badge}
                        </div>
                        ${adminBtn}
                        <button onclick="logout()" class="text-slate-400 hover:text-red-500 p-2 rounded-xl transition" title="Abmelden"><i class="fa-solid fa-right-from-bracket"></i></button>
                    </div>
                `;

                mobileContainer.innerHTML = `
                    <div class="px-4 py-2 flex items-center justify-between">
                        <div>
                            <span class="text-sm font-bold text-slate-800">${appState.currentUser.username}</span>
                            ${badge}
                        </div>
                        <button onclick="logout()" class="text-red-500 text-sm font-semibold">Abmelden</button>
                    </div>
                    ${isAdmin ? `<button onclick="router.navigate('admin'); toggleMobileMenu();" class="w-full text-left px-4 py-3 rounded-xl bg-pink-50 text-pink-600 font-semibold">Admin Dashboard</button>` : ''}
                `;
            } else {
                container.innerHTML = `
                    <button onclick="openAuthModal('login')" class="text-slate-600 hover:text-pink-600 px-4 py-2 text-sm font-semibold transition">Anmelden</button>
                    <button onclick="openAuthModal('register')" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition">Registrieren</button>
                `;

                mobileContainer.innerHTML = `
                    <button onclick="openAuthModal('login'); toggleMobileMenu();" class="w-full text-center py-3 rounded-xl bg-slate-100 font-semibold text-slate-700">Anmelden</button>
                    <button onclick="openAuthModal('register'); toggleMobileMenu();" class="w-full text-center py-3 rounded-xl gradient-bg text-white font-semibold">Registrieren</button>
                `;
            }
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        // --- 1. Startseite (Home) ---

            const publishedPosts = appState.posts.filter(p => p.status === 'published');
            const latestPost = publishedPosts[publishedPosts.length - 1];
            
            // Personalized feed logic (show 3 recent published posts)
            const feedPosts = publishedPosts.slice().reverse().slice(0, 3);

            return `

                                <button onclick="router.navigate('blog')" class="bg-white text-slate-900 hover:bg-slate-100 font-bold px-6 py-3.5 rounded-2xl shadow-lg transition flex items-center gap-2 text-sm">
                                    <i class="fa-solid fa-book-open text-pink-600"></i> Zum Blog

        // --- 2. Blog Section ---
        function renderBlogPage(categoryFilter = 'all') {

        function renderBlogCards(categoryFilter, searchQuery = '') {
            let posts = appState.posts.filter(p => p.status === 'published');
            if (categoryFilter && categoryFilter !== 'all') {
                posts = posts.filter(p => p.category === categoryFilter);
            }
            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                posts = posts.filter(p => p.title.toLowerCase().includes(q) || p.content.toLowerCase().includes(q) || p.category.toLowerCase().includes(q));
            }

            if (posts.length === 0) {
                return `
                    <div class="col-span-full py-16 text-center space-y-4 bg-white rounded-3xl border border-slate-200">
                        <div class="w-16 h-16 bg-slate-100 text-slate-400 rounded-full flex items-center justify-center mx-auto text-2xl">

                    </div>
                `;
            }

            return posts.slice().reverse().map(post => `
                <div onclick="router.navigate('post-detail', null, '${post.id}')" class="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm hover:shadow-lg transition cursor-pointer flex flex-col justify-between group">

                        <div class="p-6 space-y-3">
                            <div class="text-xs text-slate-400 font-medium">${post.date} &bull; von ${post.author}</div>
                            <h3 class="font-bold text-lg text-slate-900 group-hover:text-pink-600 transition line-clamp-2">${post.title}</h3>
                            <p class="text-slate-600 text-xs line-clamp-3 leading-relaxed">${post.content}</p>
                        </div>
                    </div>
                    <div class="px-6 pb-6 pt-2 flex items-center justify-between border-t border-slate-100 text-xs text-slate-500">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-heart text-pink-500"></i> ${post.likes} Likes</span>
                        <span class="text-pink-600 font-semibold group-hover:translate-x-1 transition">Beitrag lesen &rarr;</span>
                    </div>
                </div>
            `).join('');

        function filterBlogPosts() {
            const query = document.getElementById('blog-search-input').value;
            const grid = document.getElementById('blog-posts-grid');
            grid.innerHTML = renderBlogCards(router.currentParam, query);
        }

                                <i class="fa-solid fa-heart ${userLiked ? 'text-white' : 'text-pink-500'}"></i>
                                <span>${post.likes} ${post.likes === 1 ? 'Like' : 'Likes'}</span>
                            </button>
                            ${isAdmin ? `
                                <button onclick="deletePost('${post.id}')" class="text-red-500 hover:bg-red-50 px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                                    <i class="fa-solid fa-trash"></i> Beitrag löschen

                            ` : ''}
                        </div>

                    <!-- Comments Section -->
                    <div class="bg-white rounded-3xl p-8 sm:p-12 border border-slate-200 shadow-sm space-y-8">

                        <!-- Add Comment Form -->

                                Kommentar abschicken
                            </button>

                        <!-- Comment List -->

                                            <span class="text-slate-400 text-[10px]">&bull; ${c.date}</span>
                                        </div>
                                        <p class="text-slate-600 text-xs leading-relaxed">${c.text}</p>
                                    </div>
                                    ${isAdmin ? `
                                        <button onclick="deleteComment('${post.id}', '${c.id}')" class="text-slate-400 hover:text-red-500 text-xs p-1" title="Kommentar löschen">
                                            <i class="fa-solid fa-xmark"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleLike(postId) {
            if (!appState.currentUser) {
                openAuthModal('login');
                showToast('Bitte melde dich an, um Beiträge zu liken.', 'error');
                return;
            }
            const post = appState.posts.find(p => p.id === postId);
            if (!post) return;
            
            if (!post.likedBy) post.likedBy = [];
            const userIndex = post.likedBy.indexOf(appState.currentUser.username);
            
            if (userIndex > -1) {
                post.likedBy.splice(userIndex, 1);
                post.likes = Math.max(0, post.likes - 1);
                showToast('Like entfernt.');
            } else {
                post.likedBy.push(appState.currentUser.username);
                post.likes += 1;
                showToast('Beitrag geliked! ❤️');
            }
            saveState();
            renderApp();
        }

        function submitComment(e, postId) {
            e.preventDefault();
            const text = document.getElementById('comment-text').value;
            const author = appState.currentUser ? appState.currentUser.username : document.getElementById('comment-author').value;

            if (!appState.comments[postId]) {
                appState.comments[postId] = [];
            }

            appState.comments[postId].push({
                id: 'c-' + Date.now(),
                author,
                text,
                date: new Date().toISOString().split('T')[0]
            });

            saveState();
            showToast('Kommentar erfolgreich veröffentlicht.');
            renderApp();
        }

        function deleteComment(postId, commentId) {
            if (!appState.comments[postId]) return;
            appState.comments[postId] = appState.comments[postId].filter(c => c.id !== commentId);
            saveState();
            showToast('Kommentar gelöscht.');
            renderApp();
        }

        function deletePost(postId) {
            if (!confirm('Möchtest du diesen Beitrag wirklich unwiderruflich löschen?')) return;
            appState.posts = appState.posts.filter(p => p.id !== postId);
            saveState();
            showToast('Beitrag erfolgreich gelöscht.');
            router.navigate('blog');
        }

        // --- Admin Actions ---
        function approveSubmission(subId) {
            const sub = appState.guestSubmissions.find(s => s.id === subId);
            if (!sub) return;

            appState.posts.push({
                id: 'post-' + Date.now(),
                title: sub.title,
                category: sub.category,
                content: sub.content,
                image: sub.image || 'https://images.unsplash.com/photo-1499750310107-5fef28a66643?auto=format&fit=crop&w=800&q=80',
                video: '',
                author: sub.author,
                date: new Date().toISOString().split('T')[0],
                status: 'published',
                likes: 0,
                likedBy: []
            });

            appState.guestSubmissions = appState.guestSubmissions.filter(s => s.id !== subId);
            saveState();
            showToast('Gastbeitrag erfolgreich veröffentlicht!');
            renderApp();
        }

        function rejectSubmission(subId) {
            if (!confirm('Gastbeitrag wirklich ablehnen und löschen?')) return;
            appState.guestSubmissions = appState.guestSubmissions.filter(s => s.id !== subId);
            saveState();
            showToast('Gastbeitrag abgelehnt.');
            renderApp();
        }

        function deleteMessage(msgId) {
            appState.messages = appState.messages.filter(m => m.id !== msgId);
            saveState();
            showToast('Nachricht gelöscht.');
            renderApp();
        }

        function sendAdminReply(msgId) {
            const input = document.getElementById(`reply-input-${msgId}`);
            const replyText = input.value;
            if (!replyText) return;

            const msg = appState.messages.find(m => m.id === msgId);
            if (msg) {
                msg.reply = replyText;
                saveState();
                showToast('Antwort erfolgreich gesendet! ✉️');
                renderApp();
            }
        }

            showModal(`

                    <div class="text-center text-xs text-slate-500">
                        ${isLogin ? 'Noch kein Konto? <a href="#" onclick="openAuthModal(\'register\')" class="text-pink-600 font-semibold">Jetzt registrieren</a>' : 'Bereits ein Konto? <a href="#" onclick="openAuthModal(\'login\')" class="text-pink-600 font-semibold">Anmelden</a>'}
                    </div>
                </div>
            `);
        }

        function handleAuthSubmit(e, mode) {
            e.preventDefault();
            const username = document.getElementById('auth-username').value;
            const password = document.getElementById('auth-password').value;

            if (username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password) {
                appState.currentUser = { username: 'Admin', role: 'admin' };
                saveState();
                closeModal();
                showToast('Erfolgreich als Administrator angemeldet! 👑');
                renderApp();
                return;
            }

            if (mode === 'login') {
                // simple simulated user login
                appState.currentUser = { username, role: 'user' };
                saveState();
                closeModal();
                showToast(`Willkommen zurück, ${username}! 👋`);
                renderApp();
            } else {
                appState.currentUser = { username, role: 'user' };
                saveState();
                closeModal();
                showToast(`Konto erstellt & angemeldet als ${username}! 🎉`);
                renderApp();
            }
        }

                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Video-URL oder Embed</label>
                            <input type="text" id="ep-video" value="${post.video || ''}" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Status</label>
                            <select id="ep-status" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500">
                                <option value="published" ${post.status === 'published' ? 'selected' : ''}>Öffentlich</option>
                                <option value="draft" ${post.status === 'draft' ? 'selected' : ''}>Entwurf (privat)</option>
                            </select>
                        </div>
                        <button type="submit" class="w-full gradient-bg text-white font-bold py-3.5 rounded-xl shadow-md hover:opacity-90 transition text-sm">
                            Änderungen speichern
                        </button>
                    </form>
                </div>
            `);
        }

        function handleEditPostSubmit(e, postId) {
            e.preventDefault();
            const post = appState.posts.find(p => p.id === postId);
            if (!post) return;

            post.title = document.getElementById('ep-title').value;
            post.category = document.getElementById('ep-category').value;
            post.content = document.getElementById('ep-content').value;
            post.image = document.getElementById('ep-image').value;
            post.video = document.getElementById('ep-video').value;
            post.status = document.getElementById('ep-status').value;

            saveState();
            closeModal();
            showToast('Beitrag erfolgreich aktualisiert!');
            renderApp();
        }

        function openEditAboutModal() {
            showModal(`
                <div class="p-8 space-y-6">
                    <div class="flex justify-between items-center">
                        <h3 class="text-xl font-bold text-slate-900">"Über mich" bearbeiten</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
                    </div>
                    <form onsubmit="handleEditAboutSubmit(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Inhalt (Markdown/Text)</label>
                            <textarea id="about-textarea" rows="8" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-pink-500 resize-none">${appState.aboutText}</textarea>
                        </div>
                        <button type="submit" class="w-full gradient-bg text-white font-bold py-3.5 rounded-xl shadow-md hover:opacity-90 transition text-sm">
                            Änderungen speichern
                        </button>
                    </form>
                </div>
            `);
        }

        function handleEditAboutSubmit(e) {
            e.preventDefault();
            appState.aboutText = document.getElementById('about-textarea').value;
            saveState();
            closeModal();
            showToast('"Über mich" erfolgreich aktualisiert!');
            renderApp();
        }

        function showModal(typeOrHtml) {
            const container = document.getElementById('modal-container');
            const content = document.getElementById('modal-content');
            
            if (typeOrHtml === 'impressum') {
                content.innerHTML = `
                    <div class="p-8 space-y-4">
                        <h3 class="text-xl font-bold text-slate-900">Impressum</h3>
                        <p class="text-xs text-slate-600 leading-relaxed">Angaben gemäß § 5 TMG:<br>Mijokama – Me, my Life and I<br>Musterstraße 1<br>12345 Musterstadt<br>E-Mail: kontakt@mijokama.de</p>
                        <button onclick="closeModal()" class="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold">Schließen</button>
                    </div>
                `;
            } else if (typeOrHtml === 'datenschutz') {
                content.innerHTML = `
                    <div class="p-8 space-y-4">
                        <h3 class="text-xl font-bold text-slate-900">Datenschutzerklärung</h3>
                        <p class="text-xs text-slate-600 leading-relaxed">Wir nehmen den Schutz deiner persönlichen Daten sehr ernst. Diese Website speichert Daten lokal im Browser (localStorage) für den Prototypen-Modus und GitHub Pages Kompatibilität.</p>
                        <button onclick="closeModal()" class="w-full bg-slate-900 text-white py-3 rounded-xl text-xs font-bold">Schließen</button>
                    </div>
                `;
            } else {
                content.innerHTML = typeOrHtml;
            }
            container.classList.remove('hidden');
        }

        // --- Initialize on Page Load ---
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
